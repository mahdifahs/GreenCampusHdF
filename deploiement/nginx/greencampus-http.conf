# GreenCampus HdF : port 80 de la VM (HTTP). Ne sert qu'à deux choses :
#   1. répondre aux vérifications de Let's Encrypt (/.well-known/acme-challenge/), pour obtenir et
#      renouveler le certificat HTTPS ;
#   2. rediriger tout le reste vers https:// (sans HTTPS : ni service worker, ni notifications,
#      ni installation sur téléphone).
#
# À copier dans /etc/nginx/conf.d/greencampus-http.conf AVANT de demander le certificat (le
# serveur HTTPS de greencampus.conf ne démarre pas tant que le certificat n'existe pas).
# Voir deploiement/README.md, étape 7.

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
