# GreenCampus HdF : Nginx sur la VM AWS (région Stockholm), seul point d'entrée depuis Internet.
#
#   Internet --HTTPS 443--> Nginx (cette config, certificat Let's Encrypt) --> API 127.0.0.1:4000
#            --HTTP 80----> greencampus-http.conf (Let's Encrypt + redirection vers HTTPS)
#
# Pas de load balancer : Nginx est le seul relais devant l'API, d'où TRUST_PROXY=1.
# À copier dans /etc/nginx/conf.d/greencampus.conf APRÈS avoir obtenu le certificat (étape 7 de
# deploiement/README.md), avec proxy.conf et entetes-front.conf dans /etc/nginx/conf.d/greencampus/.
# Remplacer DOMAINE (partout) par le nom de domaine du site (ex. greencampus.example.org) :
#   sed -i 's/DOMAINE/greencampus.example.org/g' /etc/nginx/conf.d/greencampus.conf
# Le build du front (frontend/dist/) va dans /usr/share/nginx/greencampus.
# Vérifier avec `nginx -t` puis `systemctl reload nginx`.

upstream greencampus_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

server {
    # « listen 443 ssl http2 » plutôt que la directive « http2 on » : accepté aussi par les
    # versions de Nginx antérieures à 1.25 (Amazon Linux 2023).
    listen 443 ssl http2;
    server_name DOMAINE;

    ssl_certificate     /etc/letsencrypt/live/DOMAINE/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAINE/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /usr/share/nginx/greencampus;
    server_tokens off;
    charset utf-8;

    # Un bilan complet fait moins de 30 Ko ; l'API refuse de toute façon au-delà de 256 Ko.
    client_max_body_size 300k;

    # --- API et administration : transmises telles quelles ------------------------------------
    # L'API envoie ses propres en-têtes de sécurité (Helmet, CSP de /admin/) : on n'en ajoute
    # aucun ici, sinon le navigateur appliquerait deux CSP à la fois.

    location /api/ {
        proxy_pass http://greencampus_api;
        include /etc/nginx/conf.d/greencampus/proxy.conf;
    }

    location /admin {
        proxy_pass http://greencampus_api;
        include /etc/nginx/conf.d/greencampus/proxy.conf;
    }

    # Contrôle de santé : vérifie l'API ET la base (503 sinon). À utiliser pour toute
    # surveillance externe, pas "/" (Nginx répondrait 200 même si l'API est tombée).
    location = /health {
        proxy_pass http://greencampus_api;
        include /etc/nginx/conf.d/greencampus/proxy.conf;
        access_log off;
    }

    # --- Front React (frontend/dist/) ---------------------------------------------------------

    # Fichiers Vite avec empreinte dans le nom : cache long sans risque.
    location /assets/ {
        include /etc/nginx/conf.d/greencampus/entetes-front.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Le service worker et le manifeste doivent être revérifiés à chaque visite, sinon une
    # nouvelle version du site (ou des notifications) peut mettre des jours à arriver.
    location = /sw.js {
        include /etc/nginx/conf.d/greencampus/entetes-front.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/conf.d/greencampus/entetes-front.conf;
        add_header Cache-Control "no-cache" always;
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Toutes les autres routes (/bilan, /defis, /connexion…) sont gérées par React Router :
    # repli sur index.html, jamais mis en cache.
    location / {
        include /etc/nginx/conf.d/greencampus/entetes-front.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
