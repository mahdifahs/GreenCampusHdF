# En-têtes de sécurité du front (inclus dans chaque "location" statique de greencampus.conf).
# Même politique que celle de l'API (SECURITY.md, A02). Rien n'est chargé depuis un autre site :
# polices auto-hébergées, aucun script ni style en ligne. "img-src data:" sert au QR code de
# reconnexion (généré dans le navigateur).
#
# Attention Nginx : un add_header dans une location annule ceux du niveau au-dessus. C'est pour
# ça que ce fichier est inclus dans chaque location, et pas une seule fois dans "server".

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
