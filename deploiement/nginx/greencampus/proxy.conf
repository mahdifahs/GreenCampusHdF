# Transmission vers l'API (inclus par greencampus.conf).

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;

# Un seul relais devant l'API (TRUST_PROXY=1) : on REMPLACE X-Forwarded-For par l'adresse qui
# s'est réellement connectée à Nginx. Un client qui enverrait un faux X-Forwarded-For pour
# contourner la limitation de débit est ainsi ignoré.
proxy_set_header X-Forwarded-For $remote_addr;

# Le HTTPS s'arrête ici, à Nginx : on indique à l'API que la requête d'origine était en https.
proxy_set_header X-Forwarded-Proto $scheme;

proxy_connect_timeout 5s;
proxy_read_timeout 30s;
