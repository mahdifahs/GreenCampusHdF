# Environnement de développement local : base PostgreSQL uniquement.
# Le déploiement de production (API + Caddy) est géré par la partie infra.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: greencampus
      POSTGRES_PASSWORD: greencampus
      POSTGRES_DB: greencampus
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greencampus"]
      interval: 5s
      retries: 10

volumes:
  db-data:
